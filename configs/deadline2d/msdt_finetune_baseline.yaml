experiment:
  name: MSDT deadline baseline fine-tune
  use_scene_condition: false
  output_dir: checkpoints/deadline2d/baseline

data:
  root: data/RaindropClarity
  format: auto
  scene_json: null
  split_manifest: splits/raindrop_split.json
  group_regex: '(?i)^(day|night)(?:raindrop)?(?:__|[_-])(\d+)'
  val_ratio: 0.1
  patch_size: 256
  num_workers: 8

model:
  num_res: 8
  scene_embedding_dim: 32

training:
  epochs: 8
  batch_size: 4
  seed: 1234
  amp: true
  amp_dtype: bfloat16

optimizer:
  name: Adam
  lr: 0.000005
  min_lr: 0.0000005
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0

loss:
  fft_weight: 0.01
  edge_weight: 0.05

inference:
  tile_size: 0
  validation_tile_size: 0
  tile_overlap: 32
